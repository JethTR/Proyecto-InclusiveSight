<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico de vibración · InclusiveSight</title>
  <!-- Página TEMPORAL de pruebas: sirve para saber qué vibraciones acepta un celular concreto.
       No está enlazada desde la app. Se puede borrar cuando se ajusten los patrones. -->
  <style>
    :root { color-scheme: light dark; --borde: #8884; --ok: #1b7f3b; --mal: #b3261e; }
    body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 560px; margin-inline: auto; }
    h1 { font-size: 1.3rem; }
    button { display: block; width: 100%; min-height: 48px; margin: 8px 0; font: inherit; border-radius: 12px;
             border: 1px solid var(--borde); background: #8881; text-align: left; padding: 10px 14px; }
    button small { display: block; opacity: .75; }
    label { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
    #registro { white-space: pre-wrap; font: 13px/1.4 ui-monospace, monospace; border: 1px solid var(--borde);
                border-radius: 12px; padding: 10px; min-height: 4em; }
    .ok { color: var(--ok); } .mal { color: var(--mal); }
  </style>
</head>
<body>
  <h1>Diagnóstico de vibración</h1>
  <p>Toca cada botón y anota cuáles <strong>sí sientes</strong>. El registro de abajo muestra si el navegador aceptó la orden.</p>
  <p id="entorno"></p>

  <label><input type="checkbox" id="cancelar"> Cancelar antes de vibrar (<code>vibrate(0)</code>)</label>

  <div id="botones"></div>

  <h2>Registro</h2>
  <div id="registro" role="log" aria-live="polite"></div>

  <script>
    // [texto, descripción, patrón] — un número = una sola vibración; una lista = vibra, pausa, vibra...
    const PRUEBAS = [
      ['1. Continua 1500 ms', 'Igual que la alerta de escaleras', 1500],
      ['2. Una vibración de 600 ms', 'Giro a la derecha', 600],
      ['3. Una vibración de 300 ms', '', 300],
      ['4. Una vibración de 150 ms', '', 150],
      ['5. Patrón 150 · 120 · 150', 'Giro a la izquierda (dos pulsos cortos)', [150, 120, 150]],
      ['6. Patrón 350 · 200 · 350', 'Probar vibración de Ajustes', [350, 200, 350]],
      ['7. Patrón 600 · 300 · 600', 'Dos pulsos largos', [600, 300, 600]],
      ['8. Tres vibraciones de 300 ms sin patrón', 'Tres órdenes separadas, una cada 500 ms', 'secuencia'],
    ];

    const registro = document.getElementById('registro');
    function anotar(texto, ok) {
      const linea = document.createElement('div');
      if (ok !== undefined) linea.className = ok ? 'ok' : 'mal';
      linea.textContent = `${new Date().toLocaleTimeString()}  ${texto}`;
      registro.prepend(linea);
    }

    document.getElementById('entorno').textContent =
      `vibrate: ${'vibrate' in navigator ? 'sí' : 'no'} · pantalla táctil: ${matchMedia('(any-pointer: coarse)').matches ? 'sí' : 'no'} · ${navigator.userAgent}`;

    function ordenar(patron) {
      if (document.getElementById('cancelar').checked) navigator.vibrate(0);
      return navigator.vibrate(patron);
    }

    const contenedor = document.getElementById('botones');
    for (const [titulo, detalle, patron] of PRUEBAS) {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.innerHTML = `${titulo}${detalle ? `<small>${detalle}</small>` : ''}`;
      boton.addEventListener('click', () => {
        if (!('vibrate' in navigator)) { anotar(`${titulo}: este navegador no tiene vibración`, false); return; }
        if (patron === 'secuencia') {
          const resultados = [ordenar(300)];
          setTimeout(() => resultados.push(navigator.vibrate(300)), 500);
          setTimeout(() => { resultados.push(navigator.vibrate(300)); anotar(`${titulo}: ${resultados.join(', ')}`, resultados.every(Boolean)); }, 1000);
          return;
        }
        const ok = ordenar(patron);
        anotar(`${titulo}: el navegador ${ok ? 'aceptó' : 'rechazó'} la orden`, ok);
      });
      contenedor.append(boton);
    }
  </script>
</body>
</html>
